name: AI Psychology Shorts

on:
  schedule:
    - cron: "0 14 * * *"   # 9 AM ET daily
  workflow_dispatch:

jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Install ffprobe (for audio duration check)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run pipeline
        env:
          GROQ_API:       ${{ secrets.GROQ_API }}
          CLAUDE_API:     ${{ secrets.CLAUDE_API }}
          ELEVENLABS_API: ${{ secrets.ELEVENLABS_API }}
        run: python automation.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: psychology-short-${{ github.run_number }}
          retention-days: 14
          path: output_*/
