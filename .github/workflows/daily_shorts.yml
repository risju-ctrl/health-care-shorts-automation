name: Daily Psychology Shorts

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-short:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Run automation
        env:
          GOOGLE_BARD_API: ${{ secrets.GOOGLE_BARD_API }}
          CLAUDE_API: ${{ secrets.CLAUDE_API }}
          ELEVENLABS_API: ${{ secrets.ELEVENLABS_API }}
          FREEPIK_API: ${{ secrets.FREEPIK_API }}
        run: python automation.py
